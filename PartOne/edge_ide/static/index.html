<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 4 - Smart Space Mini-IDE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="brand-badge">/</div>
        <div>
          <h1>Smart Space Mini-IDE</h1>
          <p class="sub">Service Composition & Edge Orchestration (Lab 4)</p>
        </div>
      </div>
      <div class="rpi-bar">
        <div class="input-field-group">
          <label for="node-host">HOST IP</label>
          <input type="text" id="node-host" value="127.0.0.1" style="width: 110px;">
        </div>
        <div class="input-field-group">
          <label for="node-port-1">RPI-1 PORT</label>
          <input type="number" id="node-port-1" value="8080" style="width: 65px;">
        </div>
        <div class="input-field-group">
          <label for="node-port-2">RPI-2 PORT</label>
          <input type="number" id="node-port-2" value="8081" style="width: 65px;">
        </div>
        <button id="btn-connect" class="btn btn-connect">Connect</button>
        <div class="pill-group">
          <span id="node-status-pill-1" class="pill pill-offline">RPI-1: OFFLINE</span>
          <span id="node-status-pill-2" class="pill pill-offline">RPI-2: OFFLINE</span>
        </div>
      </div>
    </header>

    <!-- 1. Available Service Vectors -->
    <section class="section">
      <div class="section-title">
        <h2>1. Available Services (Vectors)</h2>
        <span id="service-count" class="counter-badge">0 found</span>
      </div>
      <div id="service-list" class="vector-grid">
        <div class="empty">Scanning for services...</div>
      </div>
    </section>

    <!-- 2. Application Composer -->
    <section class="section">
      <div class="section-title">
        <h2>2. Compose Application</h2>
        <div class="composer-actions">
          <button id="btn-add-single" class="btn btn-single">+ Single Service</button>
          <button id="btn-add-order" class="btn btn-order">+ Order Rule</button>
          <button id="btn-add-condition" class="btn btn-cond">+ Condition Rule</button>
          <button id="btn-clear-rules" class="btn btn-outline">Clear</button>
        </div>
      </div>

      <div id="rules-container" class="rules-list">
        <!-- Dynamic rules inserted here -->
      </div>

      <div class="run-bar">
        <button id="btn-run-app" class="btn btn-primary">▶ Run Application</button>
      </div>
    </section>

    <!-- 3. Execution Log -->
    <section class="section">
      <div class="section-title">
        <h2>3. Execution Output</h2>
        <button id="btn-clear-trace" class="btn btn-outline btn-sm">Clear</button>
      </div>
      <div id="trace-log" class="console-box">
        <div class="empty">Click "Run Application" to see execution results.</div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
